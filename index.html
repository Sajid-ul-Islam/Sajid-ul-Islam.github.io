  <style>
    body {
      background-color: #0b0f19;
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .loader-container { text-align: center; }
    .spinner {
      border: 2px solid rgba(56, 189, 248, 0.1);
      border-top: 2px solid #38bdf8;
      border-radius: 50%;
      width: 24px; height: 24px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .text {
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .mini-badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.35rem 0.9rem;
      background: rgba(56,189,248,0.08);
      border: 1px solid rgba(56,189,248,0.2);
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <noscript>
    <h1>Sajid Islam — Forward Deployed Engineer Portfolio</h1>
    <p>Forward Deployed Engineer (FDE). Please enable JavaScript to view the full interactive tactical terminal portfolio.</p>
    <ul>
      <li><a href="theme-tactical.html">Tactical Terminal (Camo HUD)</a></li>

    </div>
  </div>
  <script>
    (function() {
      if (new URLSearchParams(location.search).has('noredirect')) return;
      var savedTheme = localStorage.getItem('portfolio-active-theme');
      var validThemes = ['theme-tactical.html', 'mini.html', 'theme-sketchbook.html'];
      if (savedTheme && validThemes.indexOf(savedTheme) !== -1) {
        window.location.replace(savedTheme);
        return;
      }
      // Flagship Experience: Tactical Terminal
      window.location.replace('theme-tactical.html');
    })();
  </script>
